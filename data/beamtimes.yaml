# Beamtimes the group has been on. One entry per beamtime; the Beamtimes section of the
# news page and homepage is built from this list.
#
#   date:      "YYYY-MM-DD", "YYYY-MM" or "YYYY" (quoted). Use as much as is known.
#   facility:  Diamond Light Source, ESRF, ALBA, SOLEIL, ...
#   beamline:  e.g. B07-B, I09, ID26. Leave out if unknown.
#   people:    optional. Page names from content/people (e.g. helen-engelhardt) become links;
#              anything else (e.g. an external collaborator's name) is shown as plain text.
#   pillars:   optional, any of: energy-storage, catalysis, operando (the homepage pillars,
#              shown as their emoji). List all that apply, e.g. [catalysis, operando].
#   note:      optional short description, e.g. "Operando solid electrolyte".
#   post:      optional. Filename (without .md) of a news post with the full write-up.
#   proposal:  optional, for our records only (not shown on the site).
#
# Entries marked "check:" were transcribed from OneDrive folder names and need confirming.

