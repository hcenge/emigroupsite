{{ define "title" }}{{ .Title }}{{ end }}
{{ define "main" }}
<section class="bbc-research">
  <h1 class="bbc-heading">{{ .Title }}</h1>
  {{ with .Content }}
  <div class="bbc-generic-content">
    {{ . }}
  </div>
  {{ end }}

  {{ partial "news-columns.html" (dict "pages" .Pages) }}
</section>
{{ end }}
