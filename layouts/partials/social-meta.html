{{- $description := .Params.summary | default .Summary | plainify | htmlUnescape | strings.TrimSpace -}}
{{- if .IsHome }}{{ $description = "" }}{{ end -}}
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:title" content="{{ .Title | default .Site.Title }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if eq .Section "news" | and .IsPage }}article{{ else }}website{{ end }}">
{{- with $description }}
<meta name="description" content="{{ . | truncate 200 }}">
<meta property="og:description" content="{{ . | truncate 200 }}">
{{- end }}
{{- with partial "social-image.html" . }}
<meta property="og:image" content="{{ .Permalink }}">
<meta property="og:image:width" content="{{ .Width }}">
<meta property="og:image:height" content="{{ .Height }}">
<meta name="twitter:card" content="summary_large_image">
{{- end }}
{{- if eq .Section "news" | and .IsPage }}
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
{{- end }}
